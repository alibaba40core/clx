# CLX default configuration template
# Copy to ~/.clx/config.yaml on first run

provider: ollama
# Default model for the active provider.
# Default: qwen3:1.7b (best speed+accuracy on CPU). Quality tier: qwen3:4b (needs GPU or patience).
model: qwen3:1.7b

providers:
  # Optional chain (Phase 2.3): primary defaults to top-level provider when unset.
  primary: ""
  fallback: ""
  timeout: 0
  ollama:
    host: "http://localhost:11434"
    # Alternates: qwen3:4b (quality), qwen2.5:7b, llama3.1:8b — avoid gemma3:270m (fast but unreliable)
    model: qwen3:1.7b
  openai:
    api_key: ""
    model: gpt-4.1-mini
  azure:
    endpoint: ""
    api_key: ""
    deployment: ""
  gemini:
    api_key: ""
    model: gemini-2.0-flash

execution:
  auto_execute: false
  timeout: 30
  shell_integration: false

safety:
  mode: medium          # low | medium | high | custom — see clx safety help
  require_confirmation: true   # used when mode=custom
  dry_run: false               # used when mode=custom (preview-only when confirm=false)

features:
  explain: true
  cache_commands: true
  learning_mode: false
  # Hybrid fallback: when no rule/cache matches, let the AI generate a full
  # command (argv). Generated commands are still validated, risk-assessed,
  # policy-gated, and confirmed before execution.
  ai_command_generation: true

cache:
  max_entries: 1024
  ttl_days: 30
  max_disk_bytes: 5242880

aliases:
  max_aliases: 256

memory:
  enabled: true
  max_entries_per_session: 64
  max_sessions: 32
  ttl_days: 7

logging:
  enabled: true
  level: info
