# CLX default configuration template
# Copy to ~/.clx/config.yaml on first run

provider: ollama
# Default model for the active provider.
# Tested alternates for Ollama: qwen3:1.7b (lightest), qwen2.5:7b (quality), llama3.1:8b (Meta).
model: qwen3:4b

providers:
  ollama:
    host: "http://localhost:11434"
    # Tested alternates: qwen3:1.7b, qwen2.5:7b, llama3.1:8b
    model: qwen3:4b
  openai:
    api_key: ""
    model: gpt-4.1-mini
  azure:
    endpoint: ""
    api_key: ""
    deployment: ""

execution:
  auto_execute: false
  timeout: 30
  shell_integration: false

safety:
  mode: medium
  require_confirmation: true
  dry_run: true

features:
  explain: true
  cache_commands: true
  learning_mode: false

logging:
  enabled: true
  level: info
