# CLX default configuration template
# Copy to ~/.clx/config.yaml on first run

provider: ollama
model: llama3

providers:
  ollama:
    host: "http://localhost:11434"
    model: llama3
  openai:
    api_key: ""
    model: gpt-4.1-mini
  azure:
    endpoint: ""
    api_key: ""
    deployment: ""

execution:
  auto_execute: false
  timeout: 30
  shell_integration: false

safety:
  level: medium
  require_confirmation: true
  dry_run: true

features:
  explain: true
  cache_commands: true
  learning_mode: false

logging:
  enabled: true
  level: info
