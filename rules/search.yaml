intent: search_text_in_file
examples:
  - grep {{pattern}} {{file}}
  - search {{pattern}} in {{file}}
strategies:
  linux:
    primary: "grep {{pattern}} {{file}}"
  linux_rg:
    primary: "rg {{pattern}} {{file}}"
    requires_tool: rg
    priority: 10
  powershell:
    argv:
      - Select-String
      - {{pattern}}
      - {{file}}
  cmd:
    primary: "findstr {{pattern}} {{file}}"
