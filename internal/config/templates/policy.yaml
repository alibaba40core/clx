# CLX default policy template
# Copy to ~/.clx/policies/policy.yaml
#
# blocked: argv token patterns (ordered subsequence match on gen.Argv). Always enforced.
# allowed: only enforced when safety.mode=high (ignored for low, medium, custom).
# access_level: safe (no exec) | moderate (low-risk only) | full (default).
#
# Example allow-list for high safety (seeded by clx safety set mode=high):
# allowed:
#   - git
#   - docker
#   - npm

access_level: full

blocked:
  - "rm -rf /"
  - "shutdown"
  - "format"
