# CLX default configuration template
# Copy to ~/.clx/config.yaml on first run

provider: ollama
# Default model for the active provider.
# Default: qwen3:1.7b (CPU-friendly). Quality tier: qwen3:4b.
model: qwen3:1.7b

providers:
  ollama:
    host: "http://localhost:11434"
    # Alternates: qwen3:4b (quality), qwen2.5:7b, llama3.1:8b
    model: qwen3:1.7b
  openai:
    api_key: ""
    model: gpt-4.1-mini
  azure:
    endpoint: ""
    api_key: ""
    deployment: ""

execution:
  auto_execute: false
  timeout: 30
  shell_integration: false

safety:
  mode: medium
  require_confirmation: true
  dry_run: true

features:
  explain: true
  cache_commands: true
  learning_mode: false

logging:
  enabled: true
  level: info
