intent: disk_usage
examples:
  - disk usage
  - how much disk space is free
  - free disk space
  - disk space
  - df {{path}}
  - du -sh {{path}}
strategies:
  linux:
    primary: "df -h {{path}}"
  powershell:
    chain:
      stages:
        - tokens:
            - value: Get-ChildItem
            - value: -Path
            - value: {{path}}
            - value: -Recurse
            - value: -File
            - value: -ErrorAction
            - value: SilentlyContinue
        - tokens:
            - value: Measure-Object
            - value: -Property
            - value: Length
            - value: -Sum
      connectors:
        - pipe
  cmd:
    primary: "dir {{path}}"
