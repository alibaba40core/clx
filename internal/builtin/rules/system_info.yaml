# System information seed intents.
#
# Read-only introspection commands. system_uptime has no clean Windows
# equivalent in the seed set; uptime is linux/darwin only.
intents:
  - intent: current_user
    examples:
      - whoami
      - current user
    strategies:
      default:
        argv:
          - whoami

  - intent: current_date
    examples:
      - date
      - current date
      - what time is it
    strategies:
      linux:
        argv:
          - date
      powershell:
        argv:
          - Get-Date
      cmd:
        argv:
          - date
          - /t

  - intent: system_uptime
    examples:
      - uptime
      - system uptime
    strategies:
      linux:
        argv:
          - uptime
      darwin:
        argv:
          - uptime

  - intent: list_env
    examples:
      - env
      - print environment
      - list environment variables
    strategies:
      linux:
        argv:
          - env
      powershell:
        primary: "Get-ChildItem env:"

  - intent: which_command
    examples:
      - which {{command}}
      - where is {{command}}
      - find command {{command}}
    strategies:
      linux:
        argv:
          - which
          - {{command}}
      powershell:
        argv:
          - Get-Command
          - {{command}}
      cmd:
        argv:
          - where
          - {{command}}

  - intent: print_text
    examples:
      - echo {{text}}
      - print {{text}}
      - echo {{word1}} {{word2}}
    strategies:
      linux:
        argv:
          - echo
          - {{text}}
      powershell:
        argv:
          - Write-Output
          - {{text}}
      cmd:
        argv:
          - echo
          - {{text}}

  - intent: show_installed_ram
    examples:
      - how much ram is installed on this machine
      - show installed ram
      - total physical memory
    strategies:
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-CimInstance
                - value: Win32_ComputerSystem
            - tokens:
                - value: Select-Object
                - value: TotalPhysicalMemory
          connectors:
            - pipe
      linux:
        primary: "grep MemTotal /proc/meminfo"

  - intent: list_scheduled_tasks_today
    examples:
      - show scheduled tasks that run today
      - list scheduled tasks for today
    strategies:
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-ScheduledTask
            - tokens:
                - value: Where-Object
                - value: "{ (Get-ScheduledTaskInfo $_).NextRunTime.Date -eq (Get-Date).Date }"
                  expr: true
          connectors:
            - pipe

  - intent: show_disk_performance
    examples:
      - show disk read and write performance counters
    strategies:
      powershell:
        primary: "Get-CimInstance Win32_PerfFormattedData_PhysicalDisk_PhysicalDisk"
      linux:
        primary: "iostat -x 1 1"

  - intent: list_local_users
    examples:
      - list local user accounts on this computer
    strategies:
      powershell:
        argv:
          - Get-LocalUser
      linux:
        primary: "getent passwd"
