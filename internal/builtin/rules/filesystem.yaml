# Filesystem seed intents.
#
# Cross-platform file operations use argv strategies per safe-command-execution.
# Mutating intents (make_dir, create_empty_file, copy_file, move_file) are
# intentionally absent from lowVerbs in internal/risk/assess.go so they
# require confirmation before execution.
intents:
  - intent: find_modified_today
    examples:
      - find all files modified today
      - list files modified today
      - files changed today
      - show files modified today
    strategies:
      linux:
        argv:
          - find
          - {{path}}
          - -type
          - f
          - -mtime
          - 0
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-ChildItem
                - value: -Path
                - value: {{path}}
                - value: -Recurse
                - value: -File
            - tokens:
                - value: Where-Object
                - value: "{ $_.LastWriteTime.Date -eq [datetime]::Today }"
                  expr: true
          connectors:
            - pipe

  - intent: find_file
    examples:
      - locate {{filename}}
      - find file {{filename}}
      - search for {{filename}}
      - locate {{filename}} in {{path}}
      - find file {{filename}} in {{path}}
      - search for {{filename}} in {{path}}
    strategies:
      linux:
        argv:
          - find
          - {{path}}
          - -name
          - {{filename}}
      linux_fd:
        argv:
          - fd
          - -t
          - f
          - -g
          - {{filename}}
          - {{path}}
        requires_tool: fd
        priority: 10
      powershell:
        argv:
          - Get-ChildItem
          - -Path
          - {{path}}
          - -Recurse
          - -Filter
          - {{filename}}
          - -ErrorAction
          - SilentlyContinue
      cmd:
        argv:
          - dir
          - /s
          - {{path}}\{{filename}}

  - intent: list_dir
    examples:
      - ls
      - ls {{path}}
      - ls -la {{path}}
      - la
      - ll
      - ll {{path}}
      - dir
      - list directory
      - list directory {{path}}
      - dir {{path}}
    strategies:
      linux:
        argv:
          - ls
          - -la
          - {{path}}
      powershell:
        argv:
          - Get-ChildItem
          - {{path}}
      cmd:
        argv:
          - dir
          - {{path}}

  - intent: view_file
    examples:
      - cat {{file}}
      - show {{file}}
      - type {{file}}
    strategies:
      linux:
        argv:
          - cat
          - {{file}}
      powershell:
        argv:
          - Get-Content
          - {{file}}
      cmd:
        argv:
          - type
          - {{file}}

  - intent: head_file
    examples:
      - head -n {{n}} {{file}}
      - head {{n}} {{file}}
    strategies:
      linux:
        argv:
          - head
          - -n
          - {{n}}
          - {{file}}
      powershell:
        argv:
          - Get-Content
          - {{file}}
          - -TotalCount
          - {{n}}

  - intent: tail_file
    examples:
      - tail -n {{n}} {{file}}
      - tail {{n}} {{file}}
    strategies:
      linux:
        argv:
          - tail
          - -n
          - {{n}}
          - {{file}}
      powershell:
        argv:
          - Get-Content
          - {{file}}
          - -Tail
          - {{n}}

  - intent: make_dir
    examples:
      - mkdir {{path}}
      - mkdir -p {{path}}
      - create directory {{path}}
    strategies:
      linux:
        argv:
          - mkdir
          - -p
          - {{path}}
      powershell:
        argv:
          - New-Item
          - -ItemType
          - Directory
          - -Path
          - {{path}}
          - -Force
      cmd:
        argv:
          - mkdir
          - {{path}}

  - intent: create_empty_file
    examples:
      - touch {{file}}
      - create empty file {{file}}
    strategies:
      linux:
        argv:
          - touch
          - {{file}}
      powershell:
        argv:
          - New-Item
          - -ItemType
          - File
          - -Path
          - {{file}}

  - intent: find_large_files
    examples:
      - files larger than {{size}}
      - find files larger than {{size}}
      - find large files
    strategies:
      linux:
        argv:
          - find
          - {{path}}
          - -type
          - f
          - -size
          - +{{size}}
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-ChildItem
                - value: -Path
                - value: {{path}}
                - value: -Recurse
                - value: -File
            - tokens:
                - value: Where-Object
                - value: "{ $_.Length -gt {{size_bytes}} }"
                  expr: true
          connectors:
            - pipe

  - intent: copy_file
    examples:
      - cp {{source}} {{dest}}
      - copy {{source}} {{dest}}
      - copy {{source}} to {{dest}}
    strategies:
      linux:
        argv:
          - cp
          - {{source}}
          - {{dest}}
      powershell:
        argv:
          - Copy-Item
          - -Path
          - {{source}}
          - -Destination
          - {{dest}}
      cmd:
        argv:
          - copy
          - {{source}}
          - {{dest}}

  - intent: move_file
    examples:
      - mv {{source}} {{dest}}
      - move {{source}} {{dest}}
      - move {{source}} to {{dest}}
    strategies:
      linux:
        argv:
          - mv
          - {{source}}
          - {{dest}}
      powershell:
        argv:
          - Move-Item
          - -Path
          - {{source}}
          - -Destination
          - {{dest}}
      cmd:
        argv:
          - move
          - {{source}}
          - {{dest}}

  # Destructive: classified High in internal/risk/assess.go (rm/rmdir/del patterns).
  - intent: remove_file
    examples:
      - rm {{path}}
      - del {{path}}
      - remove {{path}}
      - remove file {{path}}
      - delete {{path}}
      - delete file {{path}}
    strategies:
      linux:
        argv:
          - rm
          - {{path}}
      powershell:
        argv:
          - Remove-Item
          - -Path
          - {{path}}
      cmd:
        argv:
          - del
          - {{path}}

  - intent: remove_dir
    examples:
      - rmdir {{path}}
      - rd {{path}}
      - remove directory {{path}}
      - delete directory {{path}}
    strategies:
      linux:
        argv:
          - rmdir
          - {{path}}
      powershell:
        argv:
          - Remove-Item
          - -Path
          - {{path}}
          - -Recurse
      cmd:
        argv:
          - rmdir
          - {{path}}

  - intent: extract_tar_gz
    examples:
      - extract a tar.gz file into the current folder
      - extract tar.gz to current folder
    strategies:
      linux:
        argv:
          - tar
          - -xzf
          - archive.tar.gz
          - -C
          - .
      powershell:
        argv:
          - tar
          - -xzf
          - archive.tar.gz
          - -C
          - .
      cmd:
        argv:
          - tar
          - -xzf
          - archive.tar.gz
          - -C
          - .

  - intent: compare_folders
    examples:
      - compare two folders and show differences
      - compare folders for differences
    strategies:
      linux:
        argv:
          - diff
          - -qr
          - .
          - ..
      powershell:
        argv:
          - robocopy
          - .
          - ..
          - /L
          - /NJH
          - /NJS
          - /NP
          - /NS
          - /NC
      cmd:
        argv:
          - robocopy
          - .
          - ..
          - /L
          - /NJH
          - /NJS
          - /NP
          - /NS
          - /NC

  - intent: create_symlink
    examples:
      - create a symbolic link to a directory
      - create symlink to directory
    strategies:
      linux:
        argv:
          - ln
          - -s
          - .
          - mylink
      powershell:
        argv:
          - New-Item
          - -ItemType
          - SymbolicLink
          - -Path
          - mylink
          - -Target
          - .
      cmd:
        argv:
          - mklink
          - /D
          - mylink
          - .

  - intent: find_pdf_downloads
    examples:
      - find all pdf files in the downloads folder
    strategies:
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-ChildItem
                - value: -Path
                - value: "{ Join-Path $env:USERPROFILE 'Downloads' }"
                  expr: true
                - value: -Recurse
                - value: -File
            - tokens:
                - value: Where-Object
                - value: "{ $_.Extension -eq '.pdf' }"
                  expr: true
          connectors:
            - pipe
      linux:
        primary: "find ~/Downloads -type f -name .pdf"

  - intent: find_hidden_files
    examples:
      - find hidden files in the current folder
    strategies:
      powershell:
        argv:
          - Get-ChildItem
          - -Force
          - -Hidden
      linux:
        primary: "ls -la"

  - intent: largest_files_in_folder
    examples:
      - show me the 10 largest files in this folder
    strategies:
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-ChildItem
                - value: -File
                - value: -Recurse
            - tokens:
                - value: Sort-Object
                - value: Length
                - value: -Descending
            - tokens:
                - value: Select-Object
                - value: -First
                - value: "10"
          connectors:
            - pipe
            - pipe

  - intent: compress_folder_zip
    examples:
      - compress this folder into a zip archive
    strategies:
      powershell:
        argv:
          - Compress-Archive
          - -Path
          - .
          - -DestinationPath
          - archive.zip
      linux:
        primary: "tar -czf archive.tar.gz ."

  - intent: find_todo_in_sources
    examples:
      - find every TODO comment in the source files
    strategies:
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-ChildItem
                - value: -Recurse
                - value: -File
            - tokens:
                - value: Select-String
                - value: TODO
          connectors:
            - pipe
      linux:
        primary: "grep -r TODO ."

  - intent: find_duplicate_files_by_name
    examples:
      - find duplicate files by name
    strategies:
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-ChildItem
                - value: -Recurse
                - value: -File
            - tokens:
                - value: Group-Object
                - value: Name
            - tokens:
                - value: Where-Object
                - value: "{ $_.Count -gt 1 }"
                  expr: true
          connectors:
            - pipe
            - pipe

  - intent: find_empty_files_tree
    examples:
      - find empty files in this directory tree
    strategies:
      powershell:
        chain:
          stages:
            - tokens:
                - value: Get-ChildItem
                - value: -File
                - value: -Recurse
            - tokens:
                - value: Where-Object
                - value: "{ $_.Length -eq 0 }"
                  expr: true
          connectors:
            - pipe
      linux:
        primary: "find . -type f -empty"

  - intent: list_recycle_bin
    examples:
      - list files in the recycle bin
      - show recycle bin contents
    strategies:
      powershell:
        primary: "Get-ChildItem -Force -Recurse -Path ([Environment]::GetFolderPath('RecycleBin'))"
      linux:
        primary: "ls -la ~/.local/share/Trash/files"
      cmd:
        primary: "dir /a %systemdrive%\\$Recycle.Bin"
