intent: find_file
examples:
  - locate {{filename}}
  - find file {{filename}}
  - search for {{filename}}
  - locate {{filename}} in {{path}}
  - find file {{filename}} in {{path}}
  - search for {{filename}} in {{path}}
strategies:
  linux:
    primary: "find {{path}} -name {{filename}}"
  linux_fd:
    primary: "fd -t f -g {{filename}} {{path}}"
    requires_tool: fd
    priority: 10
  powershell:
    argv:
      - Get-ChildItem
      - -Path
      - {{path}}
      - -Recurse
      - -Filter
      - {{filename}}
      - -ErrorAction
      - SilentlyContinue
  cmd:
    primary: "dir /s {{path}}\\{{filename}}"
