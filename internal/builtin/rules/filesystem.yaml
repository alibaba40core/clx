intent: find_file
examples:
  - locate {{filename}}
  - find file {{filename}}
  - search for {{filename}}
strategies:
  linux:
    primary: "find . -name {{filename}}"
  linux_fd:
    primary: "fd . -t f -g {{filename}}"
    requires_tool: fd
    priority: 10
  powershell:
    argv:
      - Get-ChildItem
      - -Recurse
      - -Filter
      - {{filename}}
  cmd:
    primary: "dir /s {{filename}}"
