name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build, package, and checksum
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"        # e.g. v1.0.0
          VERSION="${TAG#v}"              # e.g. 1.0.0
          COMMIT="$(git rev-parse --short HEAD)"
          PKG="github.com/alibaba40core/clx/internal/cliversion"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT}"

          mkdir -p dist
          DIST="$(pwd)/dist"

          # GOOS GOARCH pairs to ship.
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          for t in "${targets[@]}"; do
            read -r goos goarch <<< "$t"
            echo "==> building ${goos}/${goarch}"

            workdir="$(mktemp -d)"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi

            GOOS="$goos" GOARCH="$goarch" go build -trimpath -tags=lite -ldflags="${LDFLAGS}" \
              -o "${workdir}/clx${ext}" ./cmd/clx
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="${LDFLAGS}" \
              -o "${workdir}/clx-ai${ext}" ./cmd/clx-ai
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="${LDFLAGS}" \
              -o "${workdir}/clxmax${ext}" ./cmd/clxmax

            if [ "$goos" = "windows" ]; then
              asset="clx_${goos}_${goarch}.zip"
              (cd "${workdir}" && zip -q "${DIST}/${asset}" "clx${ext}" "clx-ai${ext}" "clxmax${ext}")
            else
              asset="clx_${goos}_${goarch}.tar.gz"
              tar -czf "${DIST}/${asset}" -C "${workdir}" "clx${ext}" "clx-ai${ext}" "clxmax${ext}"
            fi
            rm -rf "${workdir}"
          done

          echo "==> checksums"
          (cd dist && sha256sum clx_*.tar.gz clx_*.zip > checksums.txt)
          cat dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest \
            dist/*
