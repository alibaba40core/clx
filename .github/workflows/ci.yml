name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -trimpath ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race on Unix)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Test (Windows, no race — requires gcc for -race)
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Build CLI
        shell: bash
        run: |
          mkdir -p bin
          go run ./cmd/genrules
          EXE="$(go env GOEXE)"
          go build -trimpath -ldflags="-s -w" -o "bin/clx${EXE}" ./cmd/clx
          go build -trimpath -ldflags="-s -w" -o "bin/clxmax${EXE}" ./cmd/clxmax

      - name: Check runtime budgets
        shell: bash
        run: bash scripts/check-budgets.sh

      - name: Version smoke test
        shell: bash
        env:
          CLX_HOME: ${{ runner.temp }}/clx-home
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./bin/clx.exe --version
          else
            ./bin/clx --version
          fi

      - name: Doctor smoke test
        shell: bash
        env:
          CLX_HOME: ${{ runner.temp }}/clx-doctor
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./bin/clx.exe doctor
          else
            ./bin/clx doctor
          fi
